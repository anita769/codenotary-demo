# codenotary.xxx.com → 127.0.0.1:18091（CodeNotary Console）
# 注意：只代理 console。网关 18090 永不进入此配置。

server {
    listen 80;
    server_name codenotary.xxx.com;
    # certbot 会自动改写为 443 + 证书路径；先跑 HTTP 拿证
    location / {
        proxy_pass http://127.0.0.1:18091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # merge 就绪检查最坏 ~60s（subprocess 试合并），给足余量
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # 大厅 ZIP 上传（服务端另有 200KB 上限）
        client_max_body_size 1m;
    }
}
